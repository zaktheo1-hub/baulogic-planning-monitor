name: Weekly Planning Digest

on:
  # Run every Monday at 08:00 UK time
  # GitHub uses UTC, so we schedule at 07:00 UTC (BST) / 08:00 UTC (GMT).
  # Using 07:00 UTC means 08:00 in BST (summer) and 07:00 in GMT (winter).
  # For now we pick 08:00 UTC — that's 08:00 GMT / 09:00 BST. Adjust later
  # if you'd rather have it exactly 08:00 UK regardless of DST.
  schedule:
    - cron: "0 8 * * 1"
  # Manual trigger for testing
  workflow_dispatch:

# Need write permission to commit the markdown digest back to the repo
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the digest pipeline
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: python main.py

      - name: Commit the markdown digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          # Only commit if there are actually changes
          if git diff --staged --quiet; then
            echo "No new digest to commit"
          else
            git commit -m "Weekly digest: $(date -u +'%Y-%m-%d')"
            git push
          fi
